name: Tests
on:
  push:
  pull_request:
jobs:
  php-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - run: php tests/run.php
      - name: PHP lint
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
  browser-tests:
    if: ${{ vars.AWARE_WP_BASE_URL != '' && secrets.AWARE_WP_USER != '' && secrets.AWARE_WP_PASSWORD != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          AWARE_WP_BASE_URL: ${{ vars.AWARE_WP_BASE_URL }}
          AWARE_WP_USER: ${{ secrets.AWARE_WP_USER }}
          AWARE_WP_PASSWORD: ${{ secrets.AWARE_WP_PASSWORD }}
